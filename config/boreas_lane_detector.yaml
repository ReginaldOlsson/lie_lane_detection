bev_lane_detector_node:
  ros__parameters:
    bev_topic: "/ipm/bev"
    image_topic: "/boreas/image"
    image_transport: "compressed"
    homography_topic: "/ipm/homography"
    frontal_overlay_topic: "/lanes/detect/frontal_overlay"
    frame_id: "camera_lidar"

    # Boreas high-res BEV (~1448x1294): tuned for perspective IPM warps.
    # configureParamsForPerspectiveIpm() still applies at runtime for scale-dependent fields.
    use_steerable_filter: false
    connect_dashed_edges: false
    edge_anisotropic_blur: false
    edge_thin: false
    edge_low_threshold: 35.0
    edge_high_threshold: 95.0

    top_k_peaks: 10
    max_lane_hypotheses: 8
    max_output_lanes: 6
    use_iterative_peeling: true
    vote_threshold_px: 9.0
    inlier_threshold_px: 11.0
    min_inlier_ratio: 0.36
    min_inliers: 16
    min_lane_separation_px: 22.0
    peel_edge_margin_px: 14.0
    min_inlier_y_coverage: 0.32
    inlier_dedup_ratio: 0.22
    hough_hypothesis_merge_ratio: 0.85

    line_hough_threshold: 30
    line_min_length_px: 22.0
    line_max_gap_px: 10.0

    kappa_min: -0.28
    kappa_max: 0.28
    sigma_min: -0.55
    sigma_max: 0.55

    bev_bottom_exclude_px: 0.0
    bev_bottom_edge_margin_px: 30.0

    bev_use_sharpen: false
    bev_use_otsu: false
    bev_otsu_for_detection: false
    bev_gaussian_blur_ksize: 0
    bev_morph_open_px: 0
    bev_min_road_gray: 20

    use_longitudinal_line_filter: true
    longitudinal_max_deviation_rad: 0.52
    use_line_ransac_init_gate: true
    ceres_hard_gate_dist_px: 10.0
    ceres_hard_gate_angle_rad: 0.32
    ceres_heading_weight: 1.0
    ceres_reject_corridor_center: true
    ceres_corridor_half_width_px: 22.0
    use_road_manifold_joint: true

    # Cap CPU on ~20 Hz camera when bag is played at full rate.
    detect_max_rate_hz: 5.0
